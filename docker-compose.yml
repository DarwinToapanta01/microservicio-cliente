service:
  postgres:
  image: postgres:16
  container_name: postgres
  environment:
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: "123456"
    POSTGRES_DB: cliente
  volumes:
    - postgres_data:/var/lib/postgresql/data
  networks:
    - microservices-network
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U postgres -d cliente"]
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 30s
  restart: unless-stopped