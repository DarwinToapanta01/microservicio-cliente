spring.application.name=api-gateway
server.port=${SERVER_PORT:3000}

#Servicio Cliente
spring.cloud.gateway.server.webflux.routes[0].id=cliente
spring.cloud.gateway.server.webflux.routes[0].uri=${CLIENTE_SERVICIO_UR:http://localhost:3001}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=api/clientes/**

#Servicio Producto
spring.cloud.gateway.server.webflux.routes[1].id=producto
spring.cloud.gateway.server.webflux.routes[1].uri=${PRODUCTO_SERVICIO_UR:http://localhost:3002}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=api/productos/**

#Servicio Factura
spring.cloud.gateway.server.webflux.routes[2].id=factura
spring.cloud.gateway.server.webflux.routes[2].uri=${FACTURA_SERVICIO_UR:http://localhost:3003}
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=api/facturas/**

#Ruta que no se encuentaran
spring.cloud.gateway.server.webflux.routes[3].id=not-found
spring.cloud.gateway.server.webflux.routes[3].uri=forward:/not-found
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/**